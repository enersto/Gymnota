[package]
name = "gymnota_history_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
android-jni = ["dep:jni", "catalog-sqlite"]
catalog-sqlite = ["dep:rusqlite"]

[dependencies]
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
jni = { version = "0.21", default-features = false, optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
